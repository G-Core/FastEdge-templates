name: Read template registry
description: Read registry.json and instructions.md for a template and expose them as outputs.

inputs:
  template_dir:
    description: Path to the template directory (e.g. html2md).
    required: true

outputs:
  name:
    description: Template display name.
    value: ${{ steps.read.outputs.name }}
  template_id:
    description: Numeric portal template ID.
    value: ${{ steps.read.outputs.template_id }}
  descr:
    description: Short one-line description.
    value: ${{ steps.read.outputs.descr }}
  instructions:
    description: Markdown instructions (long_descr).
    value: ${{ steps.read.outputs.instructions }}
  params:
    description: JSON array of parameter definitions.
    value: ${{ steps.read.outputs.params }}
  preprod_name:
    description: Template display name, with registry.preprod.json overrides applied.
    value: ${{ steps.read.outputs.preprod_name }}
  preprod_template_id:
    description: Numeric portal template ID for preprod (only set if overridden).
    value: ${{ steps.read.outputs.preprod_template_id }}
  preprod_descr:
    description: Short one-line description, with registry.preprod.json overrides applied.
    value: ${{ steps.read.outputs.preprod_descr }}
  preprod_params:
    description: JSON array of parameter definitions, with registry.preprod.json overrides applied.
    value: ${{ steps.read.outputs.preprod_params }}

runs:
  using: composite
  steps:
    - id: read
      shell: bash
      env:
        TEMPLATE_DIR: ${{ inputs.template_dir }}
      run: |
        echo "name=$(jq -r '.name' "$TEMPLATE_DIR/registry.json")" >> "$GITHUB_OUTPUT"
        echo "template_id=$(jq -r '.template_id // empty' "$TEMPLATE_DIR/registry.json")" >> "$GITHUB_OUTPUT"
        echo "descr=$(jq -r '.description' "$TEMPLATE_DIR/registry.json")" >> "$GITHUB_OUTPUT"
        echo "params=$(jq -c '.params' "$TEMPLATE_DIR/registry.json")" >> "$GITHUB_OUTPUT"
        if [ -f "$TEMPLATE_DIR/instructions.md" ]; then
          {
            echo 'instructions<<EOF'
            cat "$TEMPLATE_DIR/instructions.md"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        fi

        MERGED=$(node "${GITHUB_ACTION_PATH}/../scripts/merge-registry.mjs" "$TEMPLATE_DIR")
        echo "preprod_name=$(echo "$MERGED" | jq -r '.name')" >> "$GITHUB_OUTPUT"
        echo "preprod_descr=$(echo "$MERGED" | jq -r '.description')" >> "$GITHUB_OUTPUT"
        echo "preprod_params=$(echo "$MERGED" | jq -c '.params')" >> "$GITHUB_OUTPUT"

        # Only pass a preprod template_id when registry.preprod.json itself
        # sets one — the merged value otherwise falls back to the prod id,
        # which must NOT be sent to the preprod deploy step.
        if [ -f "$TEMPLATE_DIR/registry.preprod.json" ]; then
          echo "preprod_template_id=$(jq -r '.template_id // empty' "$TEMPLATE_DIR/registry.preprod.json")" >> "$GITHUB_OUTPUT"
        else
          echo "preprod_template_id=" >> "$GITHUB_OUTPUT"
        fi
