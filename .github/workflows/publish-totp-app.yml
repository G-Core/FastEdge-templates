name: Publish totp-app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'edge-totp/otp-app/**'

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/_publish_js.yml
    with:
      template: totp-app
      working_directory: edge-totp
      build_command: pnpm -C otp-app build
      output_path: edge-totp/otp-app/dist/totp-app.wasm
      registry_dir: edge-totp/otp-app
    secrets: inherit
