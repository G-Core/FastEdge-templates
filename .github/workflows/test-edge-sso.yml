name: Test edge-sso

on:
  pull_request:
    paths:
      - "edge-sso/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test edge-sso
    runs-on: [self-hosted, ubuntu-22-04, regular]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import credentials from Vault
        uses: hashicorp/vault-action@v3
        id: creds
        with:
          url: https://puppet-vault.gc.onl
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/project_fastedge/harbor-robot-account username | HARBOR_LOGIN ;
            secret/project_fastedge/harbor-robot-account password | HARBOR_PASSWORD ;

      - name: Login to Harbor and pull compiler
        uses: ./.github/setup-harbor-pull
        with:
          harbor_login: ${{ steps.creds.outputs.HARBOR_LOGIN }}
          harbor_password: ${{ steps.creds.outputs.HARBOR_PASSWORD }}

      - name: Setup Node.js and install dependencies
        uses: ./.github/setup-node
        with:
          working_directory: edge-sso

      # Unit tests (no wasm needed — fast gate before any build)
      - name: Unit tests
        working-directory: edge-sso
        run: pnpm -C auth-app test:unit

      # Build TS auth-app wasm (cdn-filter is Rust, built below)
      - name: Build TS WASM
        working-directory: edge-sso
        run: pnpm -C auth-app build

      # Build Rust CDN filter — one wasm binary, all three SSO_VARIANT values
      # are exercised against it at test time (see filter.test.ts)
      - name: Build CDN filter
        uses: ./.github/build-rust
        with:
          rust_package: sso-guard
          working_directory: edge-sso/cdn-filter
          output_path: edge-sso/cdn-filter/wasm/sso_guard.wasm

      # Integration tests (require compiled wasm; covers all 3 SSO_VARIANT values)
      - name: Integration tests
        working-directory: edge-sso
        run: pnpm -C auth-app test

      - name: Filter tests
        working-directory: edge-sso
        run: pnpm -C cdn-filter test

      - name: E2E tests
        working-directory: edge-sso
        run: pnpm -C auth-app test:e2e
