[workspace]
members = [
    "core/filter",
    "templates/cookie/cdn-filter",
    "templates/gate-only/cdn-filter",
    "templates/header/cdn-filter",
]
resolver = "2"

[workspace.dependencies]
proxy-wasm = "0.2.1"
fastedge = { version = "0.4", default-features = false, features = ["proxywasm"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1.0"
urlencoding = "2.1.2"
p256 = { version = "0.13", features = ["ecdsa"] }
