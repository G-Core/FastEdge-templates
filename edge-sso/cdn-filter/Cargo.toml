[package]
name = "sso-guard"
version = "0.0.1"
edition = "2021"

[dependencies]
proxy-wasm = "0.2.1"
fastedge = { version = "0.4", default-features = false, features = ["proxywasm"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1.0"
urlencoding = "2.1.2"
p256 = { version = "0.13", features = ["ecdsa"] }

[lib]
crate-type = ["cdylib"]
