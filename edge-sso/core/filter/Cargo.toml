[package]
name = "sso-guard"
version = "0.0.1"
edition = "2021"

[dependencies]
proxy-wasm = { workspace = true }
fastedge = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
urlencoding = { workspace = true }
p256 = { workspace = true }

[features]
# Exactly one alg-* feature must be enabled (enforced via compile_error! in
# lib.rs). Pinning the accepted JWT algorithm at build time per variant prevents
# token-chosen alg confusion. `default` keeps the crate buildable
# standalone (rust-analyzer, `cargo build -p sso-guard`); each cdn-filter
# template sets `default-features = false` and selects its own alg.
default = ["alg-hs256"]
alg-hs256 = []
alg-es256 = []
strip-session-cookie = []
inject-user-header = []

[lib]
name = "sso_guard"
crate-type = ["rlib"]
