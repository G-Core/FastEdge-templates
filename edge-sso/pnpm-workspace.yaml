  "@gcoredev/fastedge-test": ^0.2.4
  "@peculiar/x509": ^1.14.3
  "@types/node": ^24.6.0
  "@xmldom/xmldom": ^0.8.11
  hono: ^4.9.8
  jose: ^6.2.2
  npm-run-all2: ^9.0.1
  tsx: ^4.20.6
  typescript: ~5.9.3
  xmldsigjs: ^2.8.5

onlyBuiltDependencies:
  - esbuild
