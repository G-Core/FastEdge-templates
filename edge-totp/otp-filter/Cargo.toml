[package]
name = "totp-filter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "0.2.1"
fastedge = { version = "0.4", default-features = false, features = ["proxywasm"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1.0"
urlencoding = "2.1.2"

[profile.release]
opt-level = "s"
lto = true
